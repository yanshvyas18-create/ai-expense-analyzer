<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Expense Analyzer</title>
    <!-- Bootstrap CSS for easy and modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold">
                <i class="fa-solid fa-wallet text-success"></i> AI Expense
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action bg-transparent text-white fw-bold">
                    <i class="fas fa-home me-2"></i> Dashboard
                </a>
                <a href="{{ url_for('add_expense') }}" class="list-group-item list-group-item-action bg-transparent text-white fw-bold">
                    <i class="fas fa-plus me-2"></i> Add Expense
                </a>
                <a href="{{ url_for('transactions') }}" class="list-group-item list-group-item-action bg-transparent text-white fw-bold">
                    <i class="fas fa-credit-card me-2"></i> Transactions
                </a>
                <a href="{{ url_for('analytics') }}" class="list-group-item list-group-item-action bg-transparent text-white fw-bold">
                    <i class="fas fa-chart-bar me-2"></i> Analytics
                </a>
                <a href="{{ url_for('insights') }}" class="list-group-item list-group-item-action bg-transparent text-white fw-bold">
                    <i class="fas fa-robot me-2"></i> AI Insights
                </a>
            </div>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 bg-light">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3 text-secondary" id="menu-toggle" style="cursor: pointer;"></i>
                    <h2 class="fs-4 m-0">{% block header %}Dashboard{% endblock %}</h2>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script>
        // Simple script to toggle sidebar on mobile
        document.getElementById("menu-toggle").addEventListener("click", function() {
            document.getElementById("wrapper").classList.toggle("toggled");
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
