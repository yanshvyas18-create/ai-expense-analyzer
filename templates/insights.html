{% extends 'base.html' %}

{% block header %}AI Spending Insights{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mb-4 bg-light">
            <div class="card-body text-center p-5">
                <i class="fas fa-brain fa-4x text-primary mb-3"></i>
                <h3 class="fw-bold">AI Analysis Complete</h3>
                <p class="text-muted">Based on your transaction history, here is what our system found.</p>
            </div>
        </div>

        <div class="list-group shadow-sm">
            {% for insight in insights %}
            <div class="list-group-item list-group-item-action p-4 border-0 mb-1 rounded bg-white">
                <div class="d-flex w-100 justify-content-between align-items-center">
                    <p class="mb-0 fs-5">{{ insight }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
